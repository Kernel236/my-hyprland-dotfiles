background {
    monitor =
    path = $HOME/.config/assets/backgrounds/whitehat/2143421-2560x1440-desktop-hd-howls-moving-castle-wallpaper.jpg
}

input-field {
    monitor =
    size = 240, 58
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(b7bdf8)
    inner_color = rgb(1e2030)
    font_color = rgb(b7bdf8)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = rgb(a6da95)
    fail_color = rgb(ed8796)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 100
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 30, 150
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(b7bdf8)
    font_size = 78
    font_family = Fira Semibold
    position = -100, 80
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = Kernel_x23_6
    color = rgb(b7bdf8)
    font_size = 26
    font_family = Fira Semibold
    position = -100, 230
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

image {
    monitor =
    path = $HOME/.config/assets/backgrounds/my-avatar-whitehat.png
    size = 250
    rounding = -1
    border_size = 3
    border_color = rgb(b7bdf8)
    rotate = 0
    reload_time = -1
    position = 30, 350
    halign = center
    valign = center
}
